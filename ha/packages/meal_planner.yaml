# Пакет Home Assistant для meal-planner (тикет 7.6).
#
# Подключение: каталог ha/packages монтируется в контейнер HA
# (/config/packages/meal_planner:ro), в configuration.yaml —
#   homeassistant:
#     packages: !include_dir_named packages
#
# Адрес — порт приложения на loopback хоста (HA в host-сети, 7.2).
# tests/test_ha_package.py сверяет URL, поля запросов и пути в шаблонах
# с frontend/openapi.json.
#
# Атрибуты сущностей LLM в Assist не видит (в контекст попадают только
# состояние и белый список атрибутов HA), поэтому полные данные модель
# получает из ответа скрипта meal_planner_plan.
#
# Остатки (8.2) — счётчики input_number конфига HA (stock.yaml). Счётчик
# учитывается, если у него есть атрибут meal_planner_ingredient — id
# ингредиента справочника (customize в конфиге HA). Вычитает и переводит
# единицы приложение (POST /api/shopping/remaining), остатки оно не хранит:
# вкладка «Закупки» и сенсоры — полный список по плану, уменьшенный — только
# в to-do и в ответе meal_planner_plan.
#
# Готовка (8.3b): блюда текущей партии и сегодняшний завтрак отмечаются
# приготовленными по одному (скрипты meal_planner_mark_cooked / _unmark_).
# Сколько списать и новые значения счётчиков считает приложение, скрипт их
# только выставляет; повторная отметка отклоняется — дважды не списать.
# Скрипты действий шлют событие meal_planner_changed — по нему сразу
# обновляется сенсор партии sensor.meal_planner_cook_batch.
#
# Рецепт от Assist (8.6): модель берёт названия из справочника
# (meal_planner_ingredients — по запросу, не сенсором: атрибутов LLM не
# видит, а сенсор опрашивал бы приложение и писал в recorder впустую) и после
# согласия пользователя сохраняет рецепт черновиком
# (meal_planner_propose_recipe). Ккал, перевод единиц и новые ингредиенты —
# в приложении; в план и покупки черновик попадает только после «В план» в UI.

homeassistant:
  customize:
    sensor.meal_planner_today:
      friendly_name: Питание сегодня
    sensor.meal_planner_tomorrow:
      friendly_name: Питание завтра
    sensor.meal_planner_next_shopping:
      friendly_name: Ближайшая закупка
    sensor.meal_planner_today_kcal:
      friendly_name: Ккал сегодня
    sensor.meal_planner_cook_batch:
      friendly_name: Готовка

rest:
  - resource: http://127.0.0.1:8001/api/summary
    scan_interval: 900
    timeout: 10
    sensor:
      - name: Meal planner today
        unique_id: meal_planner_today
        icon: mdi:food
        value_template: >-
          {% set d = value_json.days.today %}
          {%- if d.lunch -%}Обед: {{ d.lunch }}. Ужин: {{ d.dinner }}
          {%- elif d.is_skipped -%}Пауза: готовка пропущена, блюд нет
          {%- elif d.is_day_zero -%}День 0: готовка, блюда с завтра
          {%- else -%}Цикл ещё не начался{%- endif %}
        json_attributes_path: "$.days.today"
        json_attributes: [date, breakfast, lunch, dinner, kcal, protein, is_cook_day, is_skipped]
      - name: Meal planner tomorrow
        unique_id: meal_planner_tomorrow
        icon: mdi:food-outline
        value_template: >-
          {% set d = value_json.days.tomorrow %}
          {%- if d.lunch -%}Обед: {{ d.lunch }}. Ужин: {{ d.dinner }}
          {%- elif d.is_skipped -%}Пауза: готовка пропущена, блюд нет
          {%- elif d.is_day_zero -%}День 0: готовка, блюда с завтра
          {%- else -%}Цикл ещё не начался{%- endif %}
        json_attributes_path: "$.days.tomorrow"
        json_attributes: [date, breakfast, lunch, dinner, kcal, protein, is_cook_day, is_skipped]
      - name: Meal planner next shopping
        unique_id: meal_planner_next_shopping
        icon: mdi:cart
        device_class: date
        value_template: "{{ value_json.next_shopping.date }}"
        json_attributes_path: "$.next_shopping"
        json_attributes: [cook_date, window_start, window_end, cook, items]
      # Ккал сегодня числом — для истории и графиков (8.1). Отклонение от
      # суточной цели — в атрибутах; без цели они null. В дни без блюд
      # (пауза, день 0) — unavailable, а не 0: не портит средние в истории.
      # Не none в value_template: Jinja отдаёт строку «None», числовой
      # сенсор её не примет.
      - name: Meal planner today kcal
        unique_id: meal_planner_today_kcal
        icon: mdi:fire
        unit_of_measurement: ккал
        state_class: measurement
        availability: "{{ value_json.days.today.lunch is not none }}"
        value_template: "{{ value_json.days.today.kcal }}"
        json_attributes_path: "$.days.today"
        json_attributes: [protein, kcal_delta, protein_delta, nutrition]

# Партия готовки (8.3b) — сенсор-шаблон, а не REST: REST-сенсоры обновляются
# через координатор, и повторное обновление в течение 10 с откладывается —
# плитка «Готовки» менялась с задержкой. Этот сенсор сам запрашивает summary
# по событию meal_planner_changed (его шлют скрипты действий), при старте HA,
# после перезагрузки шаблонов и раз в 15 минут.
# Скрипты блюд при отказе шлют то же событие с {recipe_id, error} —
# на дашборде ответа скрипта не видно, причину показывает плитка.
# Состояние — дата готовки текущей партии; до дня 0 и после пропущенной
# готовки — unavailable. dishes: [{recipe_id, name, kind, portions, cooked}],
# breakfast — то же для сегодняшнего завтрака. Плитки вкладки «Готовка»
# дашборда «Кухня».
template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        minutes: /15
      - trigger: event
        event_type: meal_planner_changed
    actions:
      - action: rest_command.meal_planner_summary
        response_variable: resp
        continue_on_error: true
      - variables:
          cooking: >-
            {{ resp.content.cooking
               if resp is defined and resp.status == 200 else none }}
    sensor:
      - name: Meal planner cook batch
        unique_id: meal_planner_cook_batch
        icon: mdi:pot-steam
        device_class: date
        availability: "{{ cooking is not none and cooking.cook_date is not none }}"
        state: "{{ cooking.cook_date if cooking else none }}"
        attributes:
          dishes: "{{ cooking.dishes if cooking else [] }}"
          breakfast: "{{ cooking.breakfast if cooking else none }}"
          # Отказ последнего действия с блюдом ({recipe_id, error}, например
          # «Не хватает продуктов: …») — плитка показывает его вместо
          # названия; следующее действие или обновление его снимает.
          last_error: >-
            {{ trigger.event.data
               if trigger.platform == 'event'
                  and trigger.event.event_type == 'meal_planner_changed'
                  and trigger.event.data.error is defined
               else none }}

rest_command:
  meal_planner_summary:
    url: http://127.0.0.1:8001/api/summary
    method: get
    timeout: 10
  meal_planner_shopping_remaining:
    url: http://127.0.0.1:8001/api/shopping/remaining
    method: post
    content_type: application/json
    timeout: 10
    payload: '{{ {"stock": stock} | to_json }}'
  meal_planner_mark_cooked:
    url: http://127.0.0.1:8001/api/actions/mark-cooked
    method: post
    content_type: application/json
    timeout: 10
    payload: '{{ {"recipe_id": recipe_id, "stock": stock} | to_json }}'
  meal_planner_set_dish_portions:
    url: http://127.0.0.1:8001/api/actions/set-dish-portions
    method: post
    content_type: application/json
    timeout: 10
    payload: '{{ {"recipe_id": recipe_id, "portions": portions | int} | to_json }}'
  meal_planner_unmark_cooked:
    url: http://127.0.0.1:8001/api/actions/unmark-cooked
    method: post
    content_type: application/json
    timeout: 10
    payload: '{{ {"recipe_id": recipe_id, "stock": stock} | to_json }}'
  meal_planner_set_cycle_position:
    url: http://127.0.0.1:8001/api/actions/set-cycle-position
    method: post
    content_type: application/json
    timeout: 10
    payload: '{{ {"dish": dish | int} | to_json }}'
  meal_planner_set_shopping_timing:
    url: http://127.0.0.1:8001/api/actions/set-shopping-timing
    method: post
    content_type: application/json
    timeout: 10
    payload: '{{ {"shopping_timing": timing} | to_json }}'
  meal_planner_skip_next_cook:
    url: http://127.0.0.1:8001/api/actions/skip-next-cook
    method: post
    timeout: 10
  meal_planner_unskip_cook:
    url: http://127.0.0.1:8001/api/actions/unskip-cook
    method: post
    timeout: 10
  meal_planner_set_cook_schedule:
    url: http://127.0.0.1:8001/api/actions/set-cook-schedule
    method: post
    content_type: application/json
    timeout: 10
    payload: >-
      {{ {"cook_count": cook_count | int,
          "cook_weekday1": weekday1 | int,
          "cook_weekday2": weekday2 | int if weekday2 else none} | to_json }}
  meal_planner_ingredients:
    url: http://127.0.0.1:8001/api/ingredients
    method: get
    timeout: 10
  meal_planner_recipes:
    url: http://127.0.0.1:8001/api/recipes
    method: get
    timeout: 10
  meal_planner_propose_recipe:
    url: http://127.0.0.1:8001/api/actions/propose-recipe
    method: post
    content_type: application/json
    timeout: 10
    payload: >-
      {{ {"name": name, "kind": kind, "is_fish": is_fish,
          "ingredients": ingredients, "new_ingredients": new_ingredients,
          "steps": steps, "storage": storage} | to_json }}

# Скрипты — инструменты для LLM: description и fields идут в схему tool.
# Действия возвращают {ok: true} или {ok: false, error: "<текст из API>"};
# текст ошибки — по-русски из core, его можно зачитать пользователю.
script:
  meal_planner_plan:
    alias: Питание — план
    description: >-
      План питания: что на завтрак, обед и ужин сегодня и завтра (с ккал и
      белком и отклонением от суточной цели, если она задана: kcal_target,
      kcal_delta, строка nutrition), когда ближайшая закупка и день готовки,
      какие блюда готовить и что купить. В next_shopping — полный список по
      плану, в to_buy — что купить с учётом остатков дома (to_buy.ignored —
      какие остатки не учтены и почему). На вопрос «что купить» отвечай по
      to_buy. В cooking — блюда текущей партии готовки и сегодняшний завтрак
      с recipe_id и отметкой cooked (для скриптов «приготовлено»). Вызывай
      для любых вопросов о еде, готовке и покупках. Даты — в формате
      ГГГГ-ММ-ДД, today — сегодняшняя дата.
    mode: parallel
    sequence:
      - action: rest_command.meal_planner_summary
        response_variable: resp
        continue_on_error: true
      - variables:
          stock: &stock >-
            {%- set ns = namespace(lines=[]) %}
            {%- for s in states.input_number
                  if s.attributes.meal_planner_ingredient is defined
                  and s.state not in ['unknown', 'unavailable'] %}
              {%- set ns.lines = ns.lines + [{
                    "ingredient_id": s.attributes.meal_planner_ingredient | int,
                    "qty": s.state | float,
                    "unit": s.attributes.unit_of_measurement | default(''),
                    "entity_id": s.entity_id}] %}
            {%- endfor %}
            {{ ns.lines }}
      - action: rest_command.meal_planner_shopping_remaining
        data:
          stock: "{{ stock }}"
        response_variable: remaining
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - variables:
              result: >-
                {{ dict(resp.content, to_buy=remaining.content)
                   if remaining is defined and remaining.status == 200
                   else resp.content }}
          - stop: План получен
            response_variable: result
      - variables:
          result:
            error: Приложение питания недоступно
      - stop: Ошибка
        response_variable: result

  meal_planner_set_cycle_position:
    alias: Питание — какое блюдо сегодня
    description: >-
      Сдвигает цикл питания так, чтобы сегодня было блюдо номер N (1–5), или
      0 — сегодня день готовки, а блюда цикла начнутся завтра. Не каждый
      номер возможен при текущих днях готовки: при ошибке перескажи
      пользователю текст ошибки, в нём перечислены допустимые варианты.
    mode: queued
    fields:
      dish:
        name: Блюдо
        description: Номер блюда цикла сегодня, от 0 до 5 (0 — день готовки)
        required: true
        selector:
          number:
            min: 0
            max: 5
            mode: box
    sequence:
      - action: rest_command.meal_planner_set_cycle_position
        data:
          dish: "{{ dish }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.meal_planner_today
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: &error >-
              {% if resp is not defined %}Приложение питания недоступно
              {%- elif resp.content is mapping and resp.content.detail is string %}{{ resp.content.detail }}
              {%- elif resp.content is mapping %}{{ resp.content.detail | map(attribute='msg') | join('; ') }}
              {%- else %}Ошибка {{ resp.status }}{% endif %}
      - stop: Ошибка
        response_variable: result

  meal_planner_set_shopping_timing:
    alias: Питание — когда закупка
    description: >-
      Когда ходить за продуктами: в день готовки (same) или накануне (before).
    mode: queued
    fields:
      timing:
        name: Закупка
        description: same — в день готовки, before — накануне
        required: true
        selector:
          select:
            options:
              - label: В день готовки
                value: same
              - label: Накануне
                value: before
    sequence:
      - action: rest_command.meal_planner_set_shopping_timing
        data:
          timing: "{{ timing }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.meal_planner_today
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      - stop: Ошибка
        response_variable: result

  meal_planner_set_cook_schedule:
    alias: Питание — дни готовки
    description: >-
      Задаёт, сколько раз в неделю готовить (1 или 2) и в какие дни недели
      (1 — понедельник … 7 — воскресенье). При двух готовках дни должны
      различаться.
    mode: queued
    fields:
      cook_count:
        name: Готовок в неделю
        description: 1 или 2
        required: true
        selector:
          number:
            min: 1
            max: 2
            mode: box
      weekday1:
        name: Первый день
        description: День недели первой готовки, 1 — понедельник … 7 — воскресенье
        required: true
        selector:
          select:
            options: &weekdays
              - {label: Понедельник, value: "1"}
              - {label: Вторник, value: "2"}
              - {label: Среда, value: "3"}
              - {label: Четверг, value: "4"}
              - {label: Пятница, value: "5"}
              - {label: Суббота, value: "6"}
              - {label: Воскресенье, value: "7"}
      weekday2:
        name: Второй день
        description: День недели второй готовки; нужен, только если готовок 2
        required: false
        selector:
          select:
            options: *weekdays
    sequence:
      - action: rest_command.meal_planner_set_cook_schedule
        data:
          cook_count: "{{ cook_count }}"
          weekday1: "{{ weekday1 }}"
          weekday2: "{{ weekday2 | default('') }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.meal_planner_today
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      - stop: Ошибка
        response_variable: result

  meal_planner_skip_next_cook:
    alias: Питание — пропустить готовку
    description: >-
      Пропускает ближайшую готовку (уезжаем, едим не дома): дни до следующей
      готовки — пауза без блюд и без закупки, потом цикл продолжается с того
      же блюда. Уже приготовленное не меняется. Пропуск может быть только
      один; при ошибке перескажи её текст.
    mode: queued
    sequence:
      - action: rest_command.meal_planner_skip_next_cook
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.meal_planner_today
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      - stop: Ошибка
        response_variable: result

  meal_planner_unskip_cook:
    alias: Питание — отменить пропуск готовки
    description: >-
      Отменяет пропуск готовки: она снова состоится, пауза убирается. Можно,
      пока день пропущенной готовки не прошёл.
    mode: queued
    sequence:
      - action: rest_command.meal_planner_unskip_cook
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.meal_planner_today
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      - stop: Ошибка
        response_variable: result

  meal_planner_mark_cooked:
    alias: Питание — блюдо приготовлено
    description: >-
      Отмечает блюдо приготовленным и списывает его продукты из счётчиков
      запасов: блюдо текущей партии готовки (обед или ужин, со всеми
      порциями) или сегодняшний завтрак. recipe_id и названия — в разделе
      cooking ответа meal_planner_plan. Если продуктов в счётчиках не хватает,
      блюдо не отмечается — в ошибке перечислено, чего и сколько не хватает.
      Повторно отметить нельзя; при ошибке перескажи её текст. untracked в
      ответе — продукты без счётчика (их наличие не проверяется).
    mode: queued
    fields:
      recipe_id:
        name: Блюдо
        description: recipe_id блюда из cooking (например, l3, d2, b1)
        required: true
        selector:
          text:
    sequence:
      - variables:
          stock: *stock
      - action: rest_command.meal_planner_mark_cooked
        data:
          recipe_id: "{{ recipe_id }}"
          stock: "{{ stock }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          # Значения посчитало приложение; max — только защита set_value.
          - repeat:
              for_each: "{{ resp.content.counters }}"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.entity_id }}"
                  data:
                    value: >-
                      {{ [repeat.item.value,
                          state_attr(repeat.item.entity_id, 'max') | float(repeat.item.value)]
                         | min }}
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
                ignored: "{{ resp.content.ignored }}"
                untracked: "{{ resp.content.untracked }}"
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      # На дашборде ответа скрипта не видно: причину показывает плитка блюда
      # (атрибут last_error сенсора партии) — 3 секунды, снимает
      # meal_planner_clear_dish_error, не задерживая ответ.
      - event: meal_planner_changed
        event_data:
          recipe_id: "{{ recipe_id }}"
          error: "{{ result.error }}"
      - action: script.turn_on
        target:
          entity_id: script.meal_planner_clear_dish_error
      - stop: Ошибка
        response_variable: result

  meal_planner_set_dish_portions:
    alias: Питание — порции блюда
    description: >-
      Сколько порций блюда готовят на самом деле (1–20): столько продуктов
      спишется, когда блюдо отметят приготовленным. План и список покупок не
      меняются. Только для неотмеченного блюда текущей партии или
      сегодняшнего завтрака; recipe_id — из раздела cooking ответа
      meal_planner_plan.
    mode: queued
    fields:
      recipe_id:
        name: Блюдо
        description: recipe_id блюда из cooking (например, l3, d2, b1)
        required: true
        selector:
          text:
      portions:
        name: Порции
        description: Сколько порций готовят, от 1 до 20
        required: true
        selector:
          number:
            min: 1
            max: 20
            mode: box
    sequence:
      - action: rest_command.meal_planner_set_dish_portions
        data:
          recipe_id: "{{ recipe_id }}"
          portions: "{{ portions }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      # На дашборде ответа скрипта не видно: причину показывает плитка блюда
      # (атрибут last_error сенсора партии) — 3 секунды, снимает
      # meal_planner_clear_dish_error, не задерживая ответ.
      - event: meal_planner_changed
        event_data:
          recipe_id: "{{ recipe_id }}"
          error: "{{ result.error }}"
      - action: script.turn_on
        target:
          entity_id: script.meal_planner_clear_dish_error
      - stop: Ошибка
        response_variable: result

  meal_planner_unmark_cooked:
    alias: Питание — отменить «приготовлено»
    description: >-
      Снимает отметку «приготовлено» с блюда и возвращает его продукты в
      счётчики запасов — если отметили по ошибке. recipe_id — из раздела
      cooking ответа meal_planner_plan.
    mode: queued
    fields:
      recipe_id:
        name: Блюдо
        description: recipe_id отмеченного блюда из cooking
        required: true
        selector:
          text:
    sequence:
      - variables:
          stock: *stock
      - action: rest_command.meal_planner_unmark_cooked
        data:
          recipe_id: "{{ recipe_id }}"
          stock: "{{ stock }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          # Значения посчитало приложение; max — только защита set_value.
          - repeat:
              for_each: "{{ resp.content.counters }}"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.entity_id }}"
                  data:
                    value: >-
                      {{ [repeat.item.value,
                          state_attr(repeat.item.entity_id, 'max') | float(repeat.item.value)]
                         | min }}
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
                ignored: "{{ resp.content.ignored }}"
                untracked: "{{ resp.content.untracked }}"
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      # На дашборде ответа скрипта не видно: причину показывает плитка блюда
      # (атрибут last_error сенсора партии) — 3 секунды, снимает
      # meal_planner_clear_dish_error, не задерживая ответ.
      - event: meal_planner_changed
        event_data:
          recipe_id: "{{ recipe_id }}"
          error: "{{ result.error }}"
      - action: script.turn_on
        target:
          entity_id: script.meal_planner_clear_dish_error
      - stop: Ошибка
        response_variable: result

  # Служебный: через 3 с снимает «⚠ …» с плитки блюда (last_error сенсора
  # партии). restart — новый отказ заново отсчитывает 3 с.
  meal_planner_clear_dish_error:
    alias: Питание — убрать ошибку с плитки блюда
    description: >-
      Служебный скрипт дашборда: через 3 секунды убирает сообщение об отказе
      с плитки блюда. Вызывать не нужно.
    mode: restart
    sequence:
      - delay: 3
      - event: meal_planner_changed

  # Рецепт от Assist (8.6): справочник — чтобы модель не плодила дубли
  # («куриная грудка» рядом с «куриное филе»); уже существующие блюда —
  # чтобы не предлагала похожих (8.6c: похожее отклоняет приложение).
  # Имя скрипта прежнее: доступ для Assist уже открыт.
  meal_planner_ingredients:
    alias: Питание — справочник ингредиентов и блюд
    description: >-
      Справочник ингредиентов приложения питания (название и единица unit) и
      уже существующие обеды, ужины и черновики (recipes: название, тип и
      ингредиенты). Вызывай перед тем, как придумывать рецепт для
      meal_planner_propose_recipe: называй ингредиенты точно как здесь
      (иначе появятся дубли), а блюдо придумывай не похожее на recipes —
      с другим главным продуктом или основой. Чего нет в ingredients,
      описывается в new_ingredients того скрипта. ingredients — справочник,
      а не запасы дома: он только для точных названий и единиц, блюдо под
      него не подбирай.
    mode: parallel
    sequence:
      - action: rest_command.meal_planner_ingredients
        response_variable: resp
        continue_on_error: true
      - action: rest_command.meal_planner_recipes
        response_variable: recipes_resp
        continue_on_error: true
      - if: >-
          {{ resp is defined and resp.status == 200
             and recipes_resp is defined and recipes_resp.status == 200 }}
        then:
          - variables:
              result:
                ingredients: >-
                  {%- set ns = namespace(out=[]) %}
                  {%- for i in resp.content.ingredients %}
                    {%- set ns.out = ns.out + [{"name": i['name'], "unit": i['unit']}] %}
                  {%- endfor %}
                  {{ ns.out }}
                # Без шагов и количеств: модели нужен только состав.
                recipes: >-
                  {%- set ns = namespace(out=[]) %}
                  {%- for r in recipes_resp.content.values()
                        if r['kind'] != 'breakfast' and r['status'] in ['active', 'draft'] %}
                    {%- set ns.out = ns.out + [{
                          "name": r['name'], "kind": r['kind'],
                          "ingredients": r['ingredients'] | map(attribute='name') | list}] %}
                  {%- endfor %}
                  {{ ns.out }}
          - stop: Справочник получен
            response_variable: result
      - variables:
          result:
            error: Приложение питания недоступно
      - stop: Ошибка
        response_variable: result

  # Черновик — только после согласия пользователя; ошибки — с путём поля
  # (ingredients.2.unit: …), чтобы модель исправила нужную строку.
  meal_planner_propose_recipe:
    alias: Питание — сохранить рецепт черновиком
    description: >-
      Сохраняет придуманный тобой рецепт обеда или ужина черновиком в
      приложении питания. Вызывай только после того, как пользователь
      согласился сохранить предложенный рецепт («сохрани», «добавь»), — не
      для идей. Блюдо придумывай по вкусу и разнообразию: остатки продуктов
      дома (счётчики) и справочник ингредиентов на выбор блюда не влияют —
      остатки учитывай, только если пользователь прямо попросил приготовить
      из того, что есть дома. Перед вызовом получи названия из
      meal_planner_ingredients.
      Блюдо должно отличаться от существующих (recipes в
      meal_planner_ingredients) другим главным продуктом или основой:
      похожее по составу или с тем же названием приложение отклонит —
      тогда предложи пользователю другое блюдо.
      Количества — на одну порцию, в любой единице из списка: в единицу
      справочника переводит приложение. Ингредиент, которого нет в
      справочнике, опиши в new_ingredients (единица: г — твёрдое, мл —
      жидкое, ч.л. или ст.л. — специи, масла, соусы; ккал и белок на 100 г —
      твоя оценка). Ккал и белок порции считает приложение — перескажи их
      из ответа. После успеха скажи, что черновик нужно подтвердить в
      приложении: Настройки → Блюда → Черновики → «В план»; до этого его
      нет ни в плане, ни в покупках. При ошибке исправь указанное поле и
      повтори или перескажи ошибку.
    mode: queued
    fields:
      name:
        name: Название
        description: Название блюда, например «Тофу с гречкой и овощами»
        required: true
        selector:
          text:
      kind:
        name: Тип
        description: lunch — обед, dinner — ужин (завтраки не предлагаются)
        required: true
        selector:
          select:
            options:
              - value: lunch
                label: Обед
              - value: dinner
                label: Ужин
      is_fish:
        name: Рыба
        description: true, если основа блюда — рыба или морепродукты
        required: false
        selector:
          boolean:
      ingredients:
        name: Ингредиенты
        description: >-
          Строки рецепта на одну порцию: name — название из справочника или
          из new_ingredients, qty — количество, unit — единица
        required: true
        selector:
          object:
            multiple: true
            fields:
              name:
                label: Название
                required: true
                selector:
                  text:
              qty:
                label: Количество
                required: true
                selector:
                  number:
                    min: 0
                    step: any
                    mode: box
              unit:
                label: Единица
                required: true
                selector:
                  select:
                    options: [г, кг, мл, л, стакан, ч.л., ст.л., шт, зубчик]
      new_ingredients:
        name: Новые ингредиенты
        description: >-
          Только ингредиенты, которых нет в meal_planner_ingredients: unit —
          г (твёрдое), мл (жидкое), ч.л. или ст.л. (специи, масла, соусы);
          kcal_100g и protein_100g — на 100 г; grams_per_unit — вес одной
          ложки в граммах, обязателен для ч.л. и ст.л.; store_piece — вес
          штуки в магазине в unit, если продукт продаётся штуками; source —
          откуда значения
        required: false
        selector:
          object:
            multiple: true
            fields:
              name:
                label: Название
                required: true
                selector:
                  text:
              unit:
                label: Единица
                required: true
                selector:
                  select:
                    options: [г, мл, ч.л., ст.л.]
              category:
                label: Категория
                required: true
                selector:
                  select:
                    options: [Белок, Крупы, Овощи, Яйца и молочное, Прочее]
              kcal_100g:
                label: Ккал на 100 г
                required: true
                selector:
                  number:
                    min: 0
                    step: any
                    mode: box
              protein_100g:
                label: Белок на 100 г, г
                required: true
                selector:
                  number:
                    min: 0
                    max: 100
                    step: any
                    mode: box
              grams_per_unit:
                label: Вес ложки, г
                required: false
                selector:
                  number:
                    min: 0
                    step: any
                    mode: box
              store_piece:
                label: Вес штуки в магазине
                required: false
                selector:
                  number:
                    min: 0
                    step: any
                    mode: box
              source:
                label: Источник значений
                required: false
                selector:
                  text:
      steps:
        name: Шаги
        description: Шаги приготовления по порядку, каждый — отдельной строкой
        required: true
        selector:
          text:
            multiple: true
      keep:
        name: Хранение
        description: Как и сколько хранить готовое блюдо
        required: true
        selector:
          text:
      pan:
        name: Разогрев на сковороде
        description: Как разогреть на сковороде
        required: true
        selector:
          text:
      micro:
        name: Разогрев в микроволновке
        description: Как разогреть в микроволновке
        required: true
        selector:
          text:
      after:
        name: После разогрева
        description: Что добавить после разогрева, если нужно
        required: false
        selector:
          text:
    sequence:
      # Списки модель иногда передаёт строкой JSON — разбираем.
      - variables:
          lines: "{{ ingredients | from_json if ingredients is string else ingredients }}"
          added: >-
            {%- set n = new_ingredients | default([], true) %}
            {{ n | from_json if n is string else n }}
          step_list: >-
            {%- if steps is string %}
            {{ steps | from_json if steps.startswith('[') else [steps] }}
            {%- else %}{{ steps }}{% endif %}
          storage:
            keep: "{{ keep | default('') }}"
            pan: "{{ pan | default('') }}"
            micro: "{{ micro | default('') }}"
            after: "{{ after | default(none) }}"
      - action: rest_command.meal_planner_propose_recipe
        data:
          name: "{{ name }}"
          kind: "{{ kind }}"
          is_fish: "{{ is_fish | default(false) | bool }}"
          ingredients: "{{ lines }}"
          new_ingredients: "{{ added }}"
          steps: "{{ step_list }}"
          storage: "{{ storage }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - variables:
              recipe: "{{ resp.content.recipe }}"
          - variables:
              result:
                ok: true
                recipe_id: "{{ recipe.id }}"
                name: "{{ recipe.name }}"
                kcal: "{{ recipe.kcal }}"
                protein: "{{ recipe.protein }}"
                ingredients: >-
                  {%- set ns = namespace(out=[]) %}
                  {%- for i in recipe.ingredients %}
                    {%- set ns.out = ns.out + [i.name ~ ' — ' ~ i.qty_display ~ ' ' ~ i.unit] %}
                  {%- endfor %}
                  {{ ns.out }}
                new_ingredients: >-
                  {{ recipe.ingredients | selectattr('from_assist') | map(attribute='name') | list }}
                note: >-
                  Черновик сохранён. В план и покупки он попадёт после
                  подтверждения в приложении: Настройки → Блюда → Черновики →
                  «В план».
          - stop: Черновик сохранён
            response_variable: result
      - variables:
          result:
            ok: false
            error: >-
              {% if resp is not defined %}Приложение питания недоступно
              {%- elif resp.content is mapping and resp.content.detail is string %}{{ resp.content.detail }}
              {%- elif resp.content is mapping %}
              {%- for e in resp.content.detail %}{{ e.loc[1:] | join('.') }}: {{ e.msg }}{{ '; ' if not loop.last }}{% endfor %}
              {%- else %}Ошибка {{ resp.status }}{% endif %}
      - stop: Ошибка
        response_variable: result

  # Список покупок в to-do (7.8): пункты помечены в описании
  # «meal-planner <дата закупки>» — так видно свои пункты и их закупку.
  # Добавляется недостающее, купленное не возвращается, устаревшие свои
  # пункты (прошлая закупка, план поменялся) удаляются, чужие не трогаются.
  # Внимание: x.items в Jinja — метод dict, поэтому везде ['items'].
  meal_planner_sync_shopping_list:
    alias: Питание — список покупок в to-do
    description: >-
      Переносит список покупок ближайшей закупки в список дел «Покупки» с
      учётом остатков дома (счётчики продуктов): добавляет недостающее,
      убирает устаревшее, уже купленное не возвращает, чужие пункты не
      трогает. Вызывай, когда просят добавить или обновить покупки в
      списке. ignored в ответе — остатки, которые не удалось учесть.
    mode: queued
    fields:
      todo_list:
        name: Список дел
        description: >-
          Куда переносить; по умолчанию «Покупки» (todo.pokupki). Только
          список, где у пункта есть описание (Local To-do), — не «Список
          покупок» (Shopping List)
        required: false
        selector:
          entity:
            # Без supported_features: HA 2026.10 при сборке tools для LLM
            # перепроверяет уже переведённый в число флаг и падает — Assist
            # теряет все скрипты. Списки без описания пункта отсекает
            # проверка bitwise_and(64) ниже.
            filter:
              - domain: todo
    sequence:
      - variables:
          todo_entity: "{{ todo_list | default('todo.pokupki', true) }}"
          stock: *stock
      # Список могли передать не из формы (LLM): без описания пунктов
      # (SET_DESCRIPTION_ON_ITEM = 64) свои пункты не отличить от чужих.
      - if: >-
          {{ not ((state_attr(todo_entity, 'supported_features') | int(0))
                  | bitwise_and(64)) }}
        then:
          - variables:
              result:
                ok: false
                error: >-
                  Список {{ todo_entity }} не найден или не поддерживает
                  описание пункта — переносить можно в «Покупки» (todo.pokupki)
          - stop: Ошибка
            response_variable: result
      - action: rest_command.meal_planner_shopping_remaining
        data:
          stock: "{{ stock }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ not (resp is defined and resp.status == 200) }}"
        then:
          - variables:
              result:
                ok: false
                error: *error
          - stop: Ошибка
            response_variable: result
      - action: todo.get_items
        target:
          entity_id: "{{ todo_entity }}"
        data:
          status: [needs_action, completed]
        response_variable: todo
      - variables:
          tag: "meal-planner {{ resp.content.date }}"
          lines: "{{ resp.content['items'] }}"
          ours: >-
            {{ todo[todo_entity]['items']
               | selectattr('description', 'defined')
               | selectattr('description', 'match', 'meal-planner ')
               | list }}
          current: "{{ ours | selectattr('description', 'eq', tag) | list }}"
          stale: >-
            {{ (ours | rejectattr('description', 'eq', tag) | map(attribute='uid') | list)
               + (current | rejectattr('summary', 'in', lines) | map(attribute='uid') | list) }}
          missing: >-
            {{ lines | reject('in', current | map(attribute='summary') | list) | list }}
      - repeat:
          for_each: "{{ stale }}"
          sequence:
            - action: todo.remove_item
              target:
                entity_id: "{{ todo_entity }}"
              data:
                item: "{{ repeat.item }}"
      - repeat:
          for_each: "{{ missing }}"
          sequence:
            - action: todo.add_item
              target:
                entity_id: "{{ todo_entity }}"
              data:
                item: "{{ repeat.item }}"
                description: "{{ tag }}"
      - variables:
          result:
            ok: true
            added: "{{ missing | length }}"
            removed: "{{ stale | length }}"
            ignored: "{{ resp.content.ignored }}"
      - stop: Готово
        response_variable: result

automation:
  - id: meal_planner_shopping_list_morning
    alias: Питание — список покупок утром в день закупки
    description: В 07:00 в день закупки переносит список покупок в to-do.
    triggers:
      - trigger: time
        at: "07:00:00"
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.meal_planner_next_shopping') == now().date().isoformat() }}
    actions:
      - action: script.meal_planner_sync_shopping_list

# Частые вопросы — локально, без LLM (в пайплайне: «Предпочитать
# локальную обработку»). Отвечают из сенсоров, без запроса к приложению.
conversation:
  intents:
    MealPlannerToday:
      - "что [сегодня] (на обед|на ужин|едим|готовим)"
      - "что (на обед|на ужин) сегодня"
    MealPlannerTomorrow:
      - "что завтра (на обед|на ужин|едим|готовим)"
      - "что (на обед|на ужин) завтра"
    MealPlannerShopping:
      - "когда [следующая|ближайшая] (закупка|покупки)"
      - "когда [мне] (идти|ехать) (в магазин|за продуктами|за покупками)"

intent_script:
  MealPlannerToday:
    speech:
      text: >-
        {% set s = 'sensor.meal_planner_today' %}
        {%- if states(s) in ['unknown', 'unavailable'] %}План питания сейчас недоступен.
        {%- elif state_attr(s, 'lunch') %}Сегодня на обед {{ state_attr(s, 'lunch') }}, на ужин {{ state_attr(s, 'dinner') }}.
        {%- else %}Сегодня {{ states(s) | lower }}.{% endif %}
  MealPlannerTomorrow:
    speech:
      text: >-
        {% set s = 'sensor.meal_planner_tomorrow' %}
        {%- if states(s) in ['unknown', 'unavailable'] %}План питания сейчас недоступен.
        {%- elif state_attr(s, 'lunch') %}Завтра на обед {{ state_attr(s, 'lunch') }}, на ужин {{ state_attr(s, 'dinner') }}.
        {%- else %}Завтра {{ states(s) | lower }}.{% endif %}
  MealPlannerShopping:
    speech:
      text: >-
        {% set s = 'sensor.meal_planner_next_shopping' %}
        {%- if states(s) in ['unknown', 'unavailable'] %}План питания сейчас недоступен.
        {%- else %}
        {%- set days = ['в понедельник', 'во вторник', 'в среду', 'в четверг',
                        'в пятницу', 'в субботу', 'в воскресенье'] %}
        {%- set months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля',
                          'августа', 'сентября', 'октября', 'ноября', 'декабря'] %}
        {%- set d = as_datetime(states(s)).date() %}
        {%- set delta = (d - now().date()).days %}
        {%- set when = 'сегодня' if delta == 0 else 'завтра' if delta == 1
                       else days[d.weekday()] ~ ', ' ~ d.day ~ ' ' ~ months[d.month - 1] %}
        {%- set same = state_attr(s, 'cook_date') == states(s) -%}
        Ближайшая закупка {{ when }}{{ ', в день готовки' if same else ', накануне готовки' }}.
        {%- endif %}
