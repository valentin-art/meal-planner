# Пакет Home Assistant для meal-planner (тикет 7.6).
#
# Подключение: каталог ha/packages монтируется в контейнер HA
# (/config/packages/meal_planner:ro), в configuration.yaml —
#   homeassistant:
#     packages: !include_dir_named packages
#
# Адрес — порт приложения на loopback хоста (HA в host-сети, 7.2).
# tests/test_ha_package.py сверяет URL, поля запросов и пути в шаблонах
# с frontend/openapi.json.
#
# Атрибуты сущностей LLM в Assist не видит (в контекст попадают только
# состояние и белый список атрибутов HA), поэтому полные данные модель
# получает из ответа скрипта meal_planner_plan.
#
# Остатки (8.2) — счётчики input_number конфига HA (stock.yaml). Счётчик
# учитывается, если у него есть атрибут meal_planner_ingredient — id
# ингредиента справочника (customize в конфиге HA). Вычитает и переводит
# единицы приложение (POST /api/shopping/remaining), остатки оно не хранит:
# вкладка «Закупки» и сенсоры — полный список по плану, уменьшенный — только
# в to-do и в ответе meal_planner_plan.
#
# Готовка (8.3b): блюда текущей партии и сегодняшний завтрак отмечаются
# приготовленными по одному (скрипты meal_planner_mark_cooked / _unmark_).
# Сколько списать и новые значения счётчиков считает приложение, скрипт их
# только выставляет; повторная отметка отклоняется — дважды не списать.
# Скрипты действий шлют событие meal_planner_changed — по нему сразу
# обновляется сенсор партии sensor.meal_planner_cook_batch.

homeassistant:
  customize:
    sensor.meal_planner_today:
      friendly_name: Питание сегодня
    sensor.meal_planner_tomorrow:
      friendly_name: Питание завтра
    sensor.meal_planner_next_shopping:
      friendly_name: Ближайшая закупка
    sensor.meal_planner_today_kcal:
      friendly_name: Ккал сегодня
    sensor.meal_planner_cook_batch:
      friendly_name: Готовка

rest:
  - resource: http://127.0.0.1:8001/api/summary
    scan_interval: 900
    timeout: 10
    sensor:
      - name: Meal planner today
        unique_id: meal_planner_today
        icon: mdi:food
        value_template: >-
          {% set d = value_json.days.today %}
          {%- if d.lunch -%}Обед: {{ d.lunch }}. Ужин: {{ d.dinner }}
          {%- elif d.is_skipped -%}Пауза: готовка пропущена, блюд нет
          {%- elif d.is_day_zero -%}День 0: готовка, блюда с завтра
          {%- else -%}Цикл ещё не начался{%- endif %}
        json_attributes_path: "$.days.today"
        json_attributes: [date, breakfast, lunch, dinner, kcal, protein, is_cook_day, is_skipped]
      - name: Meal planner tomorrow
        unique_id: meal_planner_tomorrow
        icon: mdi:food-outline
        value_template: >-
          {% set d = value_json.days.tomorrow %}
          {%- if d.lunch -%}Обед: {{ d.lunch }}. Ужин: {{ d.dinner }}
          {%- elif d.is_skipped -%}Пауза: готовка пропущена, блюд нет
          {%- elif d.is_day_zero -%}День 0: готовка, блюда с завтра
          {%- else -%}Цикл ещё не начался{%- endif %}
        json_attributes_path: "$.days.tomorrow"
        json_attributes: [date, breakfast, lunch, dinner, kcal, protein, is_cook_day, is_skipped]
      - name: Meal planner next shopping
        unique_id: meal_planner_next_shopping
        icon: mdi:cart
        device_class: date
        value_template: "{{ value_json.next_shopping.date }}"
        json_attributes_path: "$.next_shopping"
        json_attributes: [cook_date, window_start, window_end, cook, items]
      # Ккал сегодня числом — для истории и графиков (8.1). Отклонение от
      # суточной цели — в атрибутах; без цели они null. В дни без блюд
      # (пауза, день 0) — unavailable, а не 0: не портит средние в истории.
      # Не none в value_template: Jinja отдаёт строку «None», числовой
      # сенсор её не примет.
      - name: Meal planner today kcal
        unique_id: meal_planner_today_kcal
        icon: mdi:fire
        unit_of_measurement: ккал
        state_class: measurement
        availability: "{{ value_json.days.today.lunch is not none }}"
        value_template: "{{ value_json.days.today.kcal }}"
        json_attributes_path: "$.days.today"
        json_attributes: [protein, kcal_delta, protein_delta, nutrition]

# Партия готовки (8.3b) — сенсор-шаблон, а не REST: REST-сенсоры обновляются
# через координатор, и повторное обновление в течение 10 с откладывается —
# плитка «Готовки» менялась с задержкой. Этот сенсор сам запрашивает summary
# по событию meal_planner_changed (его шлют скрипты действий), при старте HA,
# после перезагрузки шаблонов и раз в 15 минут.
# Состояние — дата готовки текущей партии; до дня 0 и после пропущенной
# готовки — unavailable. dishes: [{recipe_id, name, kind, portions, cooked}],
# breakfast — то же для сегодняшнего завтрака. Плитки вкладки «Готовка»
# дашборда «Кухня».
template:
  - triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
      - trigger: time_pattern
        minutes: /15
      - trigger: event
        event_type: meal_planner_changed
    actions:
      - action: rest_command.meal_planner_summary
        response_variable: resp
        continue_on_error: true
      - variables:
          cooking: >-
            {{ resp.content.cooking
               if resp is defined and resp.status == 200 else none }}
    sensor:
      - name: Meal planner cook batch
        unique_id: meal_planner_cook_batch
        icon: mdi:pot-steam
        device_class: date
        availability: "{{ cooking is not none and cooking.cook_date is not none }}"
        state: "{{ cooking.cook_date if cooking else none }}"
        attributes:
          dishes: "{{ cooking.dishes if cooking else [] }}"
          breakfast: "{{ cooking.breakfast if cooking else none }}"

rest_command:
  meal_planner_summary:
    url: http://127.0.0.1:8001/api/summary
    method: get
    timeout: 10
  meal_planner_shopping_remaining:
    url: http://127.0.0.1:8001/api/shopping/remaining
    method: post
    content_type: application/json
    timeout: 10
    payload: '{{ {"stock": stock} | to_json }}'
  meal_planner_mark_cooked:
    url: http://127.0.0.1:8001/api/actions/mark-cooked
    method: post
    content_type: application/json
    timeout: 10
    payload: '{{ {"recipe_id": recipe_id, "stock": stock} | to_json }}'
  meal_planner_unmark_cooked:
    url: http://127.0.0.1:8001/api/actions/unmark-cooked
    method: post
    content_type: application/json
    timeout: 10
    payload: '{{ {"recipe_id": recipe_id, "stock": stock} | to_json }}'
  meal_planner_set_cycle_position:
    url: http://127.0.0.1:8001/api/actions/set-cycle-position
    method: post
    content_type: application/json
    timeout: 10
    payload: '{{ {"dish": dish | int} | to_json }}'
  meal_planner_set_shopping_timing:
    url: http://127.0.0.1:8001/api/actions/set-shopping-timing
    method: post
    content_type: application/json
    timeout: 10
    payload: '{{ {"shopping_timing": timing} | to_json }}'
  meal_planner_skip_next_cook:
    url: http://127.0.0.1:8001/api/actions/skip-next-cook
    method: post
    timeout: 10
  meal_planner_unskip_cook:
    url: http://127.0.0.1:8001/api/actions/unskip-cook
    method: post
    timeout: 10
  meal_planner_set_cook_schedule:
    url: http://127.0.0.1:8001/api/actions/set-cook-schedule
    method: post
    content_type: application/json
    timeout: 10
    payload: >-
      {{ {"cook_count": cook_count | int,
          "cook_weekday1": weekday1 | int,
          "cook_weekday2": weekday2 | int if weekday2 else none} | to_json }}

# Скрипты — инструменты для LLM: description и fields идут в схему tool.
# Действия возвращают {ok: true} или {ok: false, error: "<текст из API>"};
# текст ошибки — по-русски из core, его можно зачитать пользователю.
script:
  meal_planner_plan:
    alias: Питание — план
    description: >-
      План питания: что на завтрак, обед и ужин сегодня и завтра (с ккал и
      белком и отклонением от суточной цели, если она задана: kcal_target,
      kcal_delta, строка nutrition), когда ближайшая закупка и день готовки,
      какие блюда готовить и что купить. В next_shopping — полный список по
      плану, в to_buy — что купить с учётом остатков дома (to_buy.ignored —
      какие остатки не учтены и почему). На вопрос «что купить» отвечай по
      to_buy. В cooking — блюда текущей партии готовки и сегодняшний завтрак
      с recipe_id и отметкой cooked (для скриптов «приготовлено»). Вызывай
      для любых вопросов о еде, готовке и покупках. Даты — в формате
      ГГГГ-ММ-ДД, today — сегодняшняя дата.
    mode: parallel
    sequence:
      - action: rest_command.meal_planner_summary
        response_variable: resp
        continue_on_error: true
      - variables:
          stock: &stock >-
            {%- set ns = namespace(lines=[]) %}
            {%- for s in states.input_number
                  if s.attributes.meal_planner_ingredient is defined
                  and s.state not in ['unknown', 'unavailable'] %}
              {%- set ns.lines = ns.lines + [{
                    "ingredient_id": s.attributes.meal_planner_ingredient | int,
                    "qty": s.state | float,
                    "unit": s.attributes.unit_of_measurement | default(''),
                    "entity_id": s.entity_id}] %}
            {%- endfor %}
            {{ ns.lines }}
      - action: rest_command.meal_planner_shopping_remaining
        data:
          stock: "{{ stock }}"
        response_variable: remaining
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - variables:
              result: >-
                {{ dict(resp.content, to_buy=remaining.content)
                   if remaining is defined and remaining.status == 200
                   else resp.content }}
          - stop: План получен
            response_variable: result
      - variables:
          result:
            error: Приложение питания недоступно
      - stop: Ошибка
        response_variable: result

  meal_planner_set_cycle_position:
    alias: Питание — какое блюдо сегодня
    description: >-
      Сдвигает цикл питания так, чтобы сегодня было блюдо номер N (1–5), или
      0 — сегодня день готовки, а блюда цикла начнутся завтра. Не каждый
      номер возможен при текущих днях готовки: при ошибке перескажи
      пользователю текст ошибки, в нём перечислены допустимые варианты.
    mode: queued
    fields:
      dish:
        name: Блюдо
        description: Номер блюда цикла сегодня, от 0 до 5 (0 — день готовки)
        required: true
        selector:
          number:
            min: 0
            max: 5
            mode: box
    sequence:
      - action: rest_command.meal_planner_set_cycle_position
        data:
          dish: "{{ dish }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.meal_planner_today
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: &error >-
              {% if resp is not defined %}Приложение питания недоступно
              {%- elif resp.content is mapping and resp.content.detail is string %}{{ resp.content.detail }}
              {%- elif resp.content is mapping %}{{ resp.content.detail | map(attribute='msg') | join('; ') }}
              {%- else %}Ошибка {{ resp.status }}{% endif %}
      - stop: Ошибка
        response_variable: result

  meal_planner_set_shopping_timing:
    alias: Питание — когда закупка
    description: >-
      Когда ходить за продуктами: в день готовки (same) или накануне (before).
    mode: queued
    fields:
      timing:
        name: Закупка
        description: same — в день готовки, before — накануне
        required: true
        selector:
          select:
            options:
              - label: В день готовки
                value: same
              - label: Накануне
                value: before
    sequence:
      - action: rest_command.meal_planner_set_shopping_timing
        data:
          timing: "{{ timing }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.meal_planner_today
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      - stop: Ошибка
        response_variable: result

  meal_planner_set_cook_schedule:
    alias: Питание — дни готовки
    description: >-
      Задаёт, сколько раз в неделю готовить (1 или 2) и в какие дни недели
      (1 — понедельник … 7 — воскресенье). При двух готовках дни должны
      различаться.
    mode: queued
    fields:
      cook_count:
        name: Готовок в неделю
        description: 1 или 2
        required: true
        selector:
          number:
            min: 1
            max: 2
            mode: box
      weekday1:
        name: Первый день
        description: День недели первой готовки, 1 — понедельник … 7 — воскресенье
        required: true
        selector:
          select:
            options: &weekdays
              - {label: Понедельник, value: "1"}
              - {label: Вторник, value: "2"}
              - {label: Среда, value: "3"}
              - {label: Четверг, value: "4"}
              - {label: Пятница, value: "5"}
              - {label: Суббота, value: "6"}
              - {label: Воскресенье, value: "7"}
      weekday2:
        name: Второй день
        description: День недели второй готовки; нужен, только если готовок 2
        required: false
        selector:
          select:
            options: *weekdays
    sequence:
      - action: rest_command.meal_planner_set_cook_schedule
        data:
          cook_count: "{{ cook_count }}"
          weekday1: "{{ weekday1 }}"
          weekday2: "{{ weekday2 | default('') }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.meal_planner_today
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      - stop: Ошибка
        response_variable: result

  meal_planner_skip_next_cook:
    alias: Питание — пропустить готовку
    description: >-
      Пропускает ближайшую готовку (уезжаем, едим не дома): дни до следующей
      готовки — пауза без блюд и без закупки, потом цикл продолжается с того
      же блюда. Уже приготовленное не меняется. Пропуск может быть только
      один; при ошибке перескажи её текст.
    mode: queued
    sequence:
      - action: rest_command.meal_planner_skip_next_cook
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.meal_planner_today
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      - stop: Ошибка
        response_variable: result

  meal_planner_unskip_cook:
    alias: Питание — отменить пропуск готовки
    description: >-
      Отменяет пропуск готовки: она снова состоится, пауза убирается. Можно,
      пока день пропущенной готовки не прошёл.
    mode: queued
    sequence:
      - action: rest_command.meal_planner_unskip_cook
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          - action: homeassistant.update_entity
            target:
              entity_id: sensor.meal_planner_today
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      - stop: Ошибка
        response_variable: result

  meal_planner_mark_cooked:
    alias: Питание — блюдо приготовлено
    description: >-
      Отмечает блюдо приготовленным и списывает его продукты из счётчиков
      запасов: блюдо текущей партии готовки (обед или ужин, со всеми
      порциями) или сегодняшний завтрак. recipe_id и названия — в разделе
      cooking ответа meal_planner_plan. Повторно отметить нельзя; при ошибке
      перескажи её текст. untracked в ответе — продукты без счётчика.
    mode: queued
    fields:
      recipe_id:
        name: Блюдо
        description: recipe_id блюда из cooking (например, l3, d2, b1)
        required: true
        selector:
          text:
    sequence:
      - variables:
          stock: *stock
      - action: rest_command.meal_planner_mark_cooked
        data:
          recipe_id: "{{ recipe_id }}"
          stock: "{{ stock }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          # Значения посчитало приложение; max — только защита set_value.
          - repeat:
              for_each: "{{ resp.content.counters }}"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.entity_id }}"
                  data:
                    value: >-
                      {{ [repeat.item.value,
                          state_attr(repeat.item.entity_id, 'max') | float(repeat.item.value)]
                         | min }}
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
                ignored: "{{ resp.content.ignored }}"
                untracked: "{{ resp.content.untracked }}"
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      - stop: Ошибка
        response_variable: result

  meal_planner_unmark_cooked:
    alias: Питание — отменить «приготовлено»
    description: >-
      Снимает отметку «приготовлено» с блюда и возвращает его продукты в
      счётчики запасов — если отметили по ошибке. recipe_id — из раздела
      cooking ответа meal_planner_plan.
    mode: queued
    fields:
      recipe_id:
        name: Блюдо
        description: recipe_id отмеченного блюда из cooking
        required: true
        selector:
          text:
    sequence:
      - variables:
          stock: *stock
      - action: rest_command.meal_planner_unmark_cooked
        data:
          recipe_id: "{{ recipe_id }}"
          stock: "{{ stock }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ resp is defined and resp.status == 200 }}"
        then:
          # Значения посчитало приложение; max — только защита set_value.
          - repeat:
              for_each: "{{ resp.content.counters }}"
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.entity_id }}"
                  data:
                    value: >-
                      {{ [repeat.item.value,
                          state_attr(repeat.item.entity_id, 'max') | float(repeat.item.value)]
                         | min }}
          - event: meal_planner_changed
          - variables:
              result:
                ok: true
                ignored: "{{ resp.content.ignored }}"
                untracked: "{{ resp.content.untracked }}"
          - stop: Готово
            response_variable: result
      - variables:
          result:
            ok: false
            error: *error
      - stop: Ошибка
        response_variable: result

  # Список покупок в to-do (7.8): пункты помечены в описании
  # «meal-planner <дата закупки>» — так видно свои пункты и их закупку.
  # Добавляется недостающее, купленное не возвращается, устаревшие свои
  # пункты (прошлая закупка, план поменялся) удаляются, чужие не трогаются.
  # Внимание: x.items в Jinja — метод dict, поэтому везде ['items'].
  meal_planner_sync_shopping_list:
    alias: Питание — список покупок в to-do
    description: >-
      Переносит список покупок ближайшей закупки в список дел «Покупки» с
      учётом остатков дома (счётчики продуктов): добавляет недостающее,
      убирает устаревшее, уже купленное не возвращает, чужие пункты не
      трогает. Вызывай, когда просят добавить или обновить покупки в
      списке. ignored в ответе — остатки, которые не удалось учесть.
    mode: queued
    fields:
      todo_list:
        name: Список дел
        description: >-
          Куда переносить; по умолчанию «Покупки» (todo.pokupki). Только
          список, где у пункта есть описание (Local To-do), — не «Список
          покупок» (Shopping List)
        required: false
        selector:
          entity:
            # Свои пункты помечаются описанием — списки без него не годятся.
            filter:
              - domain: todo
                supported_features:
                  - todo.TodoListEntityFeature.SET_DESCRIPTION_ON_ITEM
    sequence:
      - variables:
          todo_entity: "{{ todo_list | default('todo.pokupki', true) }}"
          stock: *stock
      # Список могли передать не из формы (LLM): без описания пунктов
      # (SET_DESCRIPTION_ON_ITEM = 64) свои пункты не отличить от чужих.
      - if: >-
          {{ not ((state_attr(todo_entity, 'supported_features') | int(0))
                  | bitwise_and(64)) }}
        then:
          - variables:
              result:
                ok: false
                error: >-
                  Список {{ todo_entity }} не найден или не поддерживает
                  описание пункта — переносить можно в «Покупки» (todo.pokupki)
          - stop: Ошибка
            response_variable: result
      - action: rest_command.meal_planner_shopping_remaining
        data:
          stock: "{{ stock }}"
        response_variable: resp
        continue_on_error: true
      - if: "{{ not (resp is defined and resp.status == 200) }}"
        then:
          - variables:
              result:
                ok: false
                error: *error
          - stop: Ошибка
            response_variable: result
      - action: todo.get_items
        target:
          entity_id: "{{ todo_entity }}"
        data:
          status: [needs_action, completed]
        response_variable: todo
      - variables:
          tag: "meal-planner {{ resp.content.date }}"
          lines: "{{ resp.content['items'] }}"
          ours: >-
            {{ todo[todo_entity]['items']
               | selectattr('description', 'defined')
               | selectattr('description', 'match', 'meal-planner ')
               | list }}
          current: "{{ ours | selectattr('description', 'eq', tag) | list }}"
          stale: >-
            {{ (ours | rejectattr('description', 'eq', tag) | map(attribute='uid') | list)
               + (current | rejectattr('summary', 'in', lines) | map(attribute='uid') | list) }}
          missing: >-
            {{ lines | reject('in', current | map(attribute='summary') | list) | list }}
      - repeat:
          for_each: "{{ stale }}"
          sequence:
            - action: todo.remove_item
              target:
                entity_id: "{{ todo_entity }}"
              data:
                item: "{{ repeat.item }}"
      - repeat:
          for_each: "{{ missing }}"
          sequence:
            - action: todo.add_item
              target:
                entity_id: "{{ todo_entity }}"
              data:
                item: "{{ repeat.item }}"
                description: "{{ tag }}"
      - variables:
          result:
            ok: true
            added: "{{ missing | length }}"
            removed: "{{ stale | length }}"
            ignored: "{{ resp.content.ignored }}"
      - stop: Готово
        response_variable: result

automation:
  - id: meal_planner_shopping_list_morning
    alias: Питание — список покупок утром в день закупки
    description: В 07:00 в день закупки переносит список покупок в to-do.
    triggers:
      - trigger: time
        at: "07:00:00"
    conditions:
      - condition: template
        value_template: >-
          {{ states('sensor.meal_planner_next_shopping') == now().date().isoformat() }}
    actions:
      - action: script.meal_planner_sync_shopping_list

# Частые вопросы — локально, без LLM (в пайплайне: «Предпочитать
# локальную обработку»). Отвечают из сенсоров, без запроса к приложению.
conversation:
  intents:
    MealPlannerToday:
      - "что [сегодня] (на обед|на ужин|едим|готовим)"
      - "что (на обед|на ужин) сегодня"
    MealPlannerTomorrow:
      - "что завтра (на обед|на ужин|едим|готовим)"
      - "что (на обед|на ужин) завтра"
    MealPlannerShopping:
      - "когда [следующая|ближайшая] (закупка|покупки)"
      - "когда [мне] (идти|ехать) (в магазин|за продуктами|за покупками)"

intent_script:
  MealPlannerToday:
    speech:
      text: >-
        {% set s = 'sensor.meal_planner_today' %}
        {%- if states(s) in ['unknown', 'unavailable'] %}План питания сейчас недоступен.
        {%- elif state_attr(s, 'lunch') %}Сегодня на обед {{ state_attr(s, 'lunch') }}, на ужин {{ state_attr(s, 'dinner') }}.
        {%- else %}Сегодня {{ states(s) | lower }}.{% endif %}
  MealPlannerTomorrow:
    speech:
      text: >-
        {% set s = 'sensor.meal_planner_tomorrow' %}
        {%- if states(s) in ['unknown', 'unavailable'] %}План питания сейчас недоступен.
        {%- elif state_attr(s, 'lunch') %}Завтра на обед {{ state_attr(s, 'lunch') }}, на ужин {{ state_attr(s, 'dinner') }}.
        {%- else %}Завтра {{ states(s) | lower }}.{% endif %}
  MealPlannerShopping:
    speech:
      text: >-
        {% set s = 'sensor.meal_planner_next_shopping' %}
        {%- if states(s) in ['unknown', 'unavailable'] %}План питания сейчас недоступен.
        {%- else %}
        {%- set days = ['в понедельник', 'во вторник', 'в среду', 'в четверг',
                        'в пятницу', 'в субботу', 'в воскресенье'] %}
        {%- set months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля',
                          'августа', 'сентября', 'октября', 'ноября', 'декабря'] %}
        {%- set d = as_datetime(states(s)).date() %}
        {%- set delta = (d - now().date()).days %}
        {%- set when = 'сегодня' if delta == 0 else 'завтра' if delta == 1
                       else days[d.weekday()] ~ ', ' ~ d.day ~ ' ' ~ months[d.month - 1] %}
        {%- set same = state_attr(s, 'cook_date') == states(s) -%}
        Ближайшая закупка {{ when }}{{ ', в день готовки' if same else ', накануне готовки' }}.
        {%- endif %}
