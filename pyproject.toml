[project]
name = "meal-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "valentin-art", email = "valentin.artemiev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
meal-planner = "meal_planner:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[pytest]
testpaths = ["tests"]