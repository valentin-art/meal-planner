# Как Home Assistant Ingress: приложение доступно только под префиксом,
# префикс срезается, контейнер видит запросы от "/".
server {
    listen 80;
    # Location в редиректах — относительный: снаружи порт 8080, а не 80.
    absolute_redirect off;

    # HA всегда открывает Ingress со слешем; без него ./assets и api/…
    # резолвились бы от родительского пути.
    location = /ingress-test {
        return 301 /ingress-test/;
    }

    # Имя app резолвится на каждый запрос (DNS Docker), а не один раз при
    # старте: после пересборки контейнера app у него новый IP.
    resolver 127.0.0.11 valid=5s;
    set $app http://app:8000;

    location /ingress-test/ {
        # Срезаем префикс: контейнер видит запросы от "/", как за Ingress.
        rewrite ^/ingress-test/(.*)$ /$1 break;
        proxy_pass $app;
        proxy_set_header Host $host;
        proxy_set_header X-Ingress-Path /ingress-test;
    }

    # Всё мимо префикса — ошибка, а не «случайно работает».
    location / {
        return 404;
    }
}
